# SPDX-License-Identifier: GPL-2.0-only
#
# Dependency pins for MaliMetal. This is the machine-readable copy of
# docs/DEPENDENCIES.md; the prose stays there, the build reads this file.
#
# The same shape UniXNU uses in components.toml: a repository, a revision and
# the dependency's role. A build must call
#
#     python3 tools/deps.py verify --checkout <id>=<path> ...
#
# and refuse to run when a checkout does not match. A file hash is recorded as
# well as the commit, because a local patch or a mis-fetched tag can leave the
# commit right and the file wrong.
#
# Never put a checkout in this repository. Only this file and the patch series
# are committed.

version = 1

