name: PanVK iOS target

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install meson ninja llvm pkg-config spirv-llvm-translator spirv-tools libclc
          python3 -m venv "$RUNNER_TEMP/pyvenv"
          "$RUNNER_TEMP/pyvenv/bin/pip" install mako pyyaml packaging
          echo "$RUNNER_TEMP/pyvenv/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"

      - name: Clone Mesa at the pinned tag
        run: git clone --depth 1 --branch mesa-26.2.6 https://gitlab.freedesktop.org/mesa/mesa.git mesa

      - name: Apply the patch series
        run: |
          set -eu
          for patch in patches/mesa/*.patch; do
            echo "applying $patch"
            git -C mesa apply "../$patch"
          done

      - name: Build host Mesa tools
        env:
          LLVM_CONFIG: /opt/homebrew/opt/llvm/bin/llvm-config
        run: |
          set -eu
          meson setup mesa/build-host mesa --prefix="$PWD/mesa-host" \
            -Dvulkan-drivers=panfrost -Dgallium-drivers= \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled -Dplatforms= \
            -Dzstd=disabled -Dxmlconfig=disabled -Dexpat=disabled \
            -Dshader-cache=disabled -Dbuild-tests=false \
            -Dllvm=enabled -Dmesa-clc=enabled -Dinstall-mesa-clc=true \
            -Dprecomp-compiler=enabled -Dinstall-precomp-compiler=true \
            -Dpanfrost-native-only=true \
            -Dc_args='-I${{ github.workspace }}/src/backend -Dsecure_getenv=getenv' \
            -Dcpp_args='-I${{ github.workspace }}/src/backend -Dsecure_getenv=getenv'
          ninja -C mesa/build-host -j2 install
          test -x mesa-host/bin/mesa_clc
          test -x mesa-host/bin/panfrost_compile

      - name: Cross-build PanVK for iOS
        run: |
          set -eu
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          clang=$(xcrun --sdk iphoneos --find clang)
          clangxx=$(xcrun --sdk iphoneos --find clang++)
          cat > ios.ini <<EOF
          [binaries]
          c = ['$clang']
          cpp = ['$clangxx']
          objc = ['$clang']
          ar = ['$(xcrun --sdk iphoneos --find ar)']
          strip = ['$(xcrun --sdk iphoneos --find strip)']
          [host_machine]
          system = 'darwin'
          subsystem = 'ios'
          cpu_family = 'aarch64'
          cpu = 'arm64'
          endian = 'little'
          [built-in options]
          c_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0', '-isysroot', '$sdk', '-I${{ github.workspace }}/src/backend', '-Dsecure_getenv=getenv']
          cpp_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0', '-isysroot', '$sdk', '-I${{ github.workspace }}/src/backend', '-Dsecure_getenv=getenv']
          c_link_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0', '-isysroot', '$sdk']
          cpp_link_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0', '-isysroot', '$sdk']
          objc_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0', '-isysroot', '$sdk', '-I${{ github.workspace }}/src/backend']
          objc_link_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0', '-isysroot', '$sdk']
          EOF
          export PATH="$PWD/mesa-host/bin:$PATH"
          unset PKG_CONFIG_PATH PKG_CONFIG_LIBDIR
          meson setup mesa/build-ios mesa --cross-file ios.ini \
            -Dvulkan-drivers=panfrost -Dgallium-drivers= \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled -Dplatforms= \
            -Dzstd=disabled -Dxmlconfig=disabled -Dexpat=disabled -Dshader-cache=disabled \
            -Dllvm=disabled -Dmesa-clc=system -Dprecomp-compiler=system \
            -Dvulkan-layers= -Dvideo-codecs= -Dbuild-tests=false \
            -Dpanfrost-native-only=true
          export CCC_OVERRIDE_OPTIONS='# +-Wl,-undefined,dynamic_lookup'
          ninja -C mesa/build-ios src/panfrost/vulkan/libvulkan_panfrost.dylib
          dylib=mesa/build-ios/src/panfrost/vulkan/libvulkan_panfrost.dylib
          python3 tools/fix-weak-imports.py "$dylib"
          codesign --force --sign - --pagesize 4096 "$dylib"

      - name: Package iOS addon
        run: |
          set -eu
          dylib=mesa/build-ios/src/panfrost/vulkan/libvulkan_panfrost.dylib
          test -f "$dylib"
          python3 tools/make-mali-gpu-addon.py --dylib "$dylib" --publish --output mali-gpu.addon
          shasum -a 256 "$dylib" mali-gpu.addon > artifacts.sha256

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mali-target-ios
          path: |
            mesa/build-ios/src/panfrost/vulkan/libvulkan_panfrost.dylib
            mali-gpu.addon
            artifacts.sha256
          if-no-files-found: error
          retention-days: 7
