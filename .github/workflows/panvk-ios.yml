name: PanVK iOS target

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Check out Mali-G52 (canonical NativeMaliABI.h)
        uses: actions/checkout@v4
        with:
          repository: Dracen-W/Mali-G52
          path: .kernel

      - name: Generate the pinned ABI header
        run: python3 tools/sync-abi.py --kernel .kernel

      - name: Install build tools
        run: |
          brew install meson ninja llvm pkg-config spirv-llvm-translator spirv-tools libclc vulkan-headers
          python3 -m venv "$RUNNER_TEMP/pyvenv"
          "$RUNNER_TEMP/pyvenv/bin/pip" install mako pyyaml packaging
          echo "$RUNNER_TEMP/pyvenv/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"

      - name: Clone Mesa at the pinned tag
        run: git clone --depth 1 --branch mesa-26.2.6 https://gitlab.freedesktop.org/mesa/mesa.git mesa

      - name: Apply the patch series
        run: |
          set -eu
          for patch in patches/mesa/*.patch; do
            echo "applying $patch"
            git -C mesa apply "../$patch"
          done

      - name: Build host Mesa tools
        env:
          LLVM_CONFIG: /opt/homebrew/opt/llvm/bin/llvm-config
        run: |
          set -eu
          meson setup mesa/build-host mesa --prefix="$PWD/mesa-host" \
            -Dvulkan-drivers=panfrost -Dgallium-drivers= \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled -Dplatforms= \
            -Dzstd=disabled -Dxmlconfig=disabled -Dexpat=disabled \
            -Dshader-cache=disabled -Dbuild-tests=false \
            -Dllvm=enabled -Dmesa-clc=enabled -Dinstall-mesa-clc=true \
            -Dprecomp-compiler=enabled -Dinstall-precomp-compiler=true \
            -Dpanfrost-native-only=true \
            -Dc_args='-I${{ github.workspace }}/src/backend -Dsecure_getenv=getenv' \
            -Dcpp_args='-I${{ github.workspace }}/src/backend -Dsecure_getenv=getenv'
          ninja -C mesa/build-host -j2 src/compiler/clc/mesa_clc src/compiler/spirv/vtn_bindgen2 src/panfrost/clc/panfrost_compile
          mkdir -p mesa-host/bin
          cp mesa/build-host/src/compiler/clc/mesa_clc mesa-host/bin/
          cp mesa/build-host/src/compiler/spirv/vtn_bindgen2 mesa-host/bin/
          cp mesa/build-host/src/panfrost/clc/panfrost_compile mesa-host/bin/
          test -x mesa-host/bin/mesa_clc
          test -x mesa-host/bin/vtn_bindgen2
          test -x mesa-host/bin/panfrost_compile

      - name: Cross-build PanVK for iOS
        run: |
          set -eu
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          clang=$(xcrun --sdk iphoneos --find clang)
          clangxx=$(xcrun --sdk iphoneos --find clang++)
          cat > ios.ini <<EOF
          [binaries]
          c = ['$clang']
          cpp = ['$clangxx']
          objc = ['$clang']
          ar = ['$(xcrun --sdk iphoneos --find ar)']
          strip = ['$(xcrun --sdk iphoneos --find strip)']
          [host_machine]
          system = 'darwin'
          subsystem = 'ios'
          cpu_family = 'aarch64'
          cpu = 'arm64'
          endian = 'little'
          [built-in options]
          c_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0', '-isysroot', '$sdk', '-I${{ github.workspace }}/src/backend', '-Dsecure_getenv=getenv']
          cpp_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0', '-isysroot', '$sdk', '-I${{ github.workspace }}/src/backend', '-Dsecure_getenv=getenv']
          c_link_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0', '-isysroot', '$sdk']
          cpp_link_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0', '-isysroot', '$sdk']
          objc_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0', '-isysroot', '$sdk', '-I${{ github.workspace }}/src/backend']
          objc_link_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0', '-isysroot', '$sdk']
          EOF
          export PATH="$PWD/mesa-host/bin:$PATH"
          unset PKG_CONFIG_PATH PKG_CONFIG_LIBDIR
          meson setup mesa/build-ios mesa --cross-file ios.ini \
            -Dvulkan-drivers=panfrost -Dgallium-drivers= \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled -Dplatforms= \
            -Dzstd=disabled -Dxmlconfig=disabled -Dexpat=disabled -Dshader-cache=disabled \
            -Dllvm=disabled -Dmesa-clc=system -Dprecomp-compiler=system \
            -Dvulkan-layers= -Dvideo-codecs= -Dbuild-tests=false \
            -Dpanfrost-native-only=true
          export CCC_OVERRIDE_OPTIONS='# +-Wl,-undefined,dynamic_lookup'
          ninja -C mesa/build-ios src/panfrost/vulkan/libvulkan_panfrost.dylib
          dylib=mesa/build-ios/src/panfrost/vulkan/libvulkan_panfrost.dylib
          python3 tools/fix-weak-imports.py "$dylib"
          codesign --force --sign - --pagesize 4096 "$dylib"

      - name: Build and sign the target smoke process
        run: |
          set -eu
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          clangxx=$(xcrun --sdk iphoneos --find clang++)
          "$clangxx" -target arm64-apple-ios17.0 -isysroot "$sdk" \
            -std=c++17 -O2 -g -Wall -Wextra -Werror \
            -Ibuild/abi -Isrc -Isrc/backend -Isrc/native_mali -Isrc/transport \
            -dynamiclib \
            src/backend/native_mali_kmod.cpp \
            src/native_mali/NativeMaliAbiTable.cpp \
            src/native_mali/NativeMaliClient.cpp \
            src/native_mali/NativeMaliError.cpp \
            src/native_mali/NativeMaliBoTable.cpp \
            src/native_mali/NativeMaliIovaAllocator.cpp \
            src/native_mali/NativeMaliFenceTracker.cpp \
            src/native_mali/NativeMaliDevice.cpp \
            -framework IOKit -framework CoreFoundation \
            -o build/libnative_mali_facade.dylib
          "$clangxx" -target arm64-apple-ios17.0 -isysroot "$sdk" \
            -std=c++17 -O2 -g -Wall -Wextra -Werror \
            -I/opt/homebrew/include tests/panvk_smoke.cpp -o build/panvk_smoke
          cat > build/panvk-smoke-entitlements.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.private.security.no-container</key><true/>
            <key>com.apple.security.iokit-user-client-class</key>
            <array><string>NativeMaliGpuClient</string></array>
          </dict>
          </plist>
          EOF
          codesign --force --sign - --pagesize 4096 --identifier org.dracen.native-mali-facade \
            build/libnative_mali_facade.dylib
          codesign --force --sign - --pagesize 4096 --identifier org.dracen.panvk-smoke \
            --entitlements build/panvk-smoke-entitlements.plist build/panvk_smoke
          codesign --verify --strict build/libnative_mali_facade.dylib
          codesign --verify --strict build/panvk_smoke

      - name: Package iOS addon
        run: |
          set -eu
          dylib=mesa/build-ios/src/panfrost/vulkan/libvulkan_panfrost.dylib
          test -f "$dylib"
          test -f build/libnative_mali_facade.dylib
          test -f build/panvk_smoke
          python3 tools/make-mali-gpu-addon.py --dylib "$dylib" \
            --facade build/libnative_mali_facade.dylib --smoke build/panvk_smoke \
            --output mali-gpu.addon
          python3 - <<'PY'
          import json
          import re
          import subprocess
          paths = {
              'panvk_smoke': 'build/panvk_smoke',
              'facade': 'build/libnative_mali_facade.dylib',
              'panvk': 'mesa/build-ios/src/panfrost/vulkan/libvulkan_panfrost.dylib',
          }
          hashes = {}
          for name, path in paths.items():
              detail = subprocess.run(['codesign', '--display', '--verbose=4', path],
                                      check=True, capture_output=True, text=True).stderr
              hashes[name] = re.search(r'^CDHash=([a-f0-9]{40})$', detail, re.M)[1]
          json.dump(hashes, open('target-trust.json', 'w'), indent=2)
          PY
          shasum -a 256 "$dylib" build/libnative_mali_facade.dylib build/panvk_smoke mali-gpu.addon > artifacts.sha256

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mali-target-ios
          path: |
            mesa/build-ios/src/panfrost/vulkan/libvulkan_panfrost.dylib
            build/libnative_mali_facade.dylib
            build/panvk_smoke
            mali-gpu.addon
            target-trust.json
            artifacts.sha256
          if-no-files-found: error
          retention-days: 7
