# SPDX-License-Identifier: GPL-2.0-only
name: host tests

on:
  push:
  pull_request:

jobs:
  # The userspace stack, on a Mac runner: the ABI header comes from the
  # canonical kernel repository, never from a copy committed here.
  host:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Check out Mali-G52 (canonical NativeMaliABI.h)
        uses: actions/checkout@v4
        with:
          repository: Dracen-W/Mali-G52
          path: .kernel

      - name: Host tests
        env:
          MALI_G52_DIR: ${{ github.workspace }}/.kernel
        run: tests/run.sh

      - name: Host tests under AddressSanitizer and UBSan
        env:
          MALI_G52_DIR: ${{ github.workspace }}/.kernel
        run: tests/run.sh --san

  # The translator pin only: small, fast, and it fails loudly when the pin file
  # and the upstream revision disagree. Mesa is skipped here because a shallow
  # checkout of its tree is large; verify it locally with
  # MALI_DEPS_DIR=... tests/run.sh, or in a dedicated job if that changes.
  metal2vulkan-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch metal2vulkan at the pinned revision
        run: |
          set -eu
          revision=$(python3 - <<'PY'
          import tomllib
          with open('deps/deps.toml', 'rb') as handle:
              pins = tomllib.load(handle)
          for dependency in pins['dependency']:
              if dependency['id'] == 'metal2vulkan':
                  print(dependency['revision'])
                  break
          else:
              raise SystemExit('metal2vulkan is not pinned')
          PY
          )
          mkdir -p .deps/metal2vulkan
          git -C .deps/metal2vulkan init --quiet
          git -C .deps/metal2vulkan remote add origin https://github.com/steelbrain/metal2vulkan
          git -C .deps/metal2vulkan fetch --quiet --depth 1 origin "$revision"
          git -C .deps/metal2vulkan checkout --quiet --detach FETCH_HEAD

      - name: Verify the recorded file hashes
        run: python3 tools/deps.py verify --checkout metal2vulkan=.deps/metal2vulkan

  # The dependency chain that the Metal frontend actually links against:
  # official AdrenoMetal + the pinned metal2vulkan + the patch series, compiled
  # as a static library. This is the check that would have caught the wrong
  # metal2vulkan pin.
  bridge:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the pinned checkouts
        run: python3 tools/deps.py fetch --dest .deps --id metal2vulkan --id adrenometal

      - name: Verify the recorded hashes
        run: python3 tools/deps.py verify --checkout metal2vulkan=.deps/metal2vulkan --checkout adrenometal=.deps/adrenometal

      - name: Install LLVM (llvm-as)
        run: brew install llvm

      - name: Build the bridge
        env:
          LLVM_AS: /opt/homebrew/opt/llvm/bin/llvm-as
          METAL2VULKAN_DIR: ${{ github.workspace }}/.deps/metal2vulkan
          ADRENOMETAL_DIR: ${{ github.workspace }}/.deps/adrenometal
        run: tools/build-bridge-host.sh

  # The Mesa seam, compiled rather than asserted: apply the patch series to the
  # pinned Mesa and build the touched unit on Linux. This does not run any
  # driver and does not prove GPU behaviour.
  mesa-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build pkg-config \
            libdrm-dev python3-mako python3-yaml

      - name: Clone Mesa at the pinned tag
        run: git clone --depth 1 --branch mesa-26.2.6 https://gitlab.freedesktop.org/mesa/mesa.git mesa

      - name: Apply the patch series
        run: |
          set -eu
          for patch in patches/mesa/*.patch; do
            echo "applying $patch"
            git -C mesa apply "../$patch"
          done

      - name: Configure
        run: |
          # tools=panfrost pulls in src/panfrost without selecting a driver.
          # A panfrost driver pulls CLC, which pulls LLVM and the SPIR-V
          # translator; the kmod unit does not need any of that.
          meson setup mesa/build mesa \
            -Dvulkan-drivers= \
            -Dgallium-drivers= \
            -Dtools=panfrost \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled \
            -Dllvm=disabled -Dplatforms= \
            -Dmicrosoft-clc=disabled \
            -Dzstd=disabled \
            -Dc_args=-I${{ github.workspace }}/src/backend

      - name: Build the pan_kmod unit
        run: ninja -C mesa/build src/panfrost/lib/kmod/libpankmod_lib.a

  # The Vulkan driver configuration, for patches that touch panvk (the JM
  # queue, vk_sync). A panfrost Vulkan driver forces CLC -> LLVM + the SPIR-V
  # translator, so this job builds the translator from source at the version
  # that matches the runner's LLVM 22. It compiles upstream Mesa with our
  # series applied; it runs nothing.
  mesa-panvk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build pkg-config \
            libdrm-dev python3-mako python3-yaml llvm llvm-dev libclang-dev clang cmake
          # Mesa's clc build also looks for clang-cpp; the package name follows
          # the LLVM version on some Ubuntu releases.
          # CLC links the clang libraries; the runner's LLVM is 22.
          sudo apt-get install -y libclang-cpp22-dev libclang-22-dev clang-22 \
            || sudo apt-get install -y libclang-cpp-dev libclang-dev clang


      - name: Clone Mesa at the pinned tag
        run: git clone --depth 1 --branch mesa-26.2.6 https://gitlab.freedesktop.org/mesa/mesa.git mesa

      - name: Build the SPIR-V LLVM translator
        run: |
          set -eu
          llvm_root=$(llvm-config-22 --cmakedir)
          git clone --depth 1 --branch v22.1.8 \
            https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git spirv
          cmake -S spirv -B spirv/build -G Ninja \
            -DLLVM_DIR="$llvm_root" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/spirv-prefix" \
            -DBUILD_SHARED_LIBS=ON
          cmake --build spirv/build -j"$(nproc)"
          cmake --install spirv/build

      - name: Build SPIRV-Tools
        run: |
          set -eu
          # Matching Vulkan SDK tags for the headers and the tools.
          git clone --depth 1 --branch vulkan-sdk-1.4.363.0 \
            https://github.com/KhronosGroup/SPIRV-Headers.git spirv-headers
          git clone --depth 1 --branch vulkan-sdk-1.4.363.0 \
            https://github.com/KhronosGroup/SPIRV-Tools.git spirv-tools
          cmake -S spirv-tools -B spirv-tools/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPIRV-Headers_SOURCE_DIR="$PWD/spirv-headers" \
            -DSPIRV_SKIP_TESTS=ON -DSPIRV_WERROR=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/spirv-tools-prefix"
          cmake --build spirv-tools/build -j"$(nproc)"
          cmake --install spirv-tools/build

      - name: Apply the patch series
        run: |
          set -eu
          for patch in patches/mesa/*.patch; do
            echo "applying $patch"
            git -C mesa apply "../$patch"
          done

      - name: Configure the Vulkan driver
        run: |
          PKG_CONFIG_PATH="$PWD/spirv-prefix/lib/pkgconfig:$PWD/spirv-tools-prefix/lib/pkgconfig:$PWD/spirv-tools-prefix/lib/x86_64-linux-gnu/pkgconfig" \
          CMAKE_PREFIX_PATH="$PWD/spirv-prefix:$PWD/spirv-tools-prefix" \
          meson setup mesa/build mesa \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers= \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled \
            -Dplatforms= \
            -Dzstd=disabled \
            -Dc_args=-I${{ github.workspace }}/src/backend

      - name: Build panvk
        run: ninja -C mesa/build src/panfrost/vulkan/libvulkan_panfrost.so

      - name: Build native-only PanVK
        run: |
          PKG_CONFIG_PATH="$PWD/spirv-prefix/lib/pkgconfig:$PWD/spirv-tools-prefix/lib/pkgconfig:$PWD/spirv-tools-prefix/lib/x86_64-linux-gnu/pkgconfig" \
          CMAKE_PREFIX_PATH="$PWD/spirv-prefix:$PWD/spirv-tools-prefix" \
          meson setup mesa/build-native mesa \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers= \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled \
            -Dplatforms= \
            -Dzstd=disabled \
            -Dmicrosoft-clc=disabled \
            -Dpanfrost-native-only=true \
            -Dc_args=-I${{ github.workspace }}/src/backend
          ninja -C mesa/build-native src/panfrost/vulkan/libvulkan_panfrost.so
