name: PanVK target

on:
  workflow_dispatch:

jobs:
  macos-target:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install target build tools
        run: |
          brew install meson ninja llvm
          python3 -m pip install --user mako pyyaml

      - name: Clone Mason at the pinned tag
        run: git clone --depth 1 --branch mesa-26.2.6 https://gitlab.freedesktop.org/mesa/mesa.git mesa

      - name: Apply the patch series
        run: |
          set -eu
          for patch in patches/mesa/*.patch; do
            echo "applying $patch"
            git -C mesa apply "../$patch"
          done

      - name: Build native PanVK for macOS
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          meson setup mesa/build-macos mesa \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers= \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled \
            -Dplatforms= \
            -Dzstd=disabled \
            -Dmicrosoft-clc=disabled \
            -Dpanfrost-native-only=true \
            -Dc_args=-I${{ github.workspace }}/src/backend \
            -Dcpp_args=-I${{ github.workspace }}/src/backend
          ninja -C mesa/build-macos src/panfrost/vulkan/libvulkan_panfrost.dylib

      - name: Build native PanVK for iOS
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          cat > ios.ini <<INI
          [binaries]
          c = ['xcrun', '--sdk', 'iphoneos', 'clang']
          cpp = ['xcrun', '--sdk', 'iphoneos', 'clang++']
          ar = ['xcrun', '--sdk', 'iphoneos', 'ar']
          strip = ['xcrun', '--sdk', 'iphoneos', 'strip']
          pkg-config = '/opt/homebrew/bin/pkg-config'
          [host_machine]
          system = 'darwin'
          cpu_family = 'aarch64'
          cpu = 'arm64'
          endian = 'little'
          [properties]
          c_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0', '-isysroot', '$sdk']
          cpp_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0', '-isysroot', '$sdk', '-I${{ github.workspace }}/src/backend']
          c_link_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0', '-isysroot', '$sdk']
          cpp_link_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0', '-isysroot', '$sdk']
          INI
          meson setup mesa/build-ios mesa --cross-file ios.ini \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers= \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled \
            -Dplatforms= \
            -Dzstd=disabled \
            -Dmicrosoft-clc=disabled \
            -Dpanfrost-native-only=true \
            -Dc_args=-I${{ github.workspace }}/src/backend \
            -Dcpp_args=-I${{ github.workspace }}/src/backend
          ninja -C mesa/build-ios src/panfrost/vulkan/libvulkan_panfrost.dylib

      - name: Package Mali GPU addon
        run: |
          set -eu
          dylib=mesa/build-ios/src/panfrost/vulkan/libvulkan_panfrost.dylib
          test -f "$dylib"
          codesign --force --sign - --pagesize 4096 "$dylib"
          python3 tools/make-mali-gpu-addon.py --dylib "$dylib" --publish --output mali-gpu.addon
          shasum -a 256 "$dylib" mali-gpu.addon > artifacts.sha256

      - name: Upload target artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mali-target
          path: |
            mesa/build-ios/src/panfrost/vulkan/libvulkan_panfrost.dylib
            mali-gpu.addon
            artifacts.sha256
          if-no-files-found: error
          retention-days: 7
