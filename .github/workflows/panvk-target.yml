name: PanVK target

on:
  workflow_dispatch:

jobs:
  macos-target:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install target build tools
        run: |
          brew install meson ninja llvm pkg-config spirv-llvm-translator spirv-tools
          python3 -m venv "$RUNNER_TEMP/pyvenv"
          "$RUNNER_TEMP/pyvenv/bin/pip" install mako pyyaml packaging
          echo "$RUNNER_TEMP/pyvenv/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Clone Mason at the pinned tag
        run: git clone --depth 1 --branch mesa-26.2.6 https://gitlab.freedesktop.org/mesa/mesa.git mesa

      - name: Apply the patch series
        run: |
          set -eu
          for patch in patches/mesa/*.patch; do
            echo "applying $patch"
            git -C mesa apply "../$patch"
          done

      - name: Build native PanVK for macOS
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          meson setup mesa/build-macos mesa \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers= \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled \
            -Dplatforms= \
            -Dzstd=disabled \
            -Dxmlconfig=disabled -Dexpat=disabled \
            -Dshader-cache=disabled -Dbuild-tests=false \
            -Dmicrosoft-clc=disabled \
            -Dpanfrost-native-only=true \
            -Dc_args='-I${{ github.workspace }}/src/backend -Dsecure_getenv=getenv' \
            -Dcpp_args='-I${{ github.workspace }}/src/backend -Dsecure_getenv=getenv'
          export CCC_OVERRIDE_OPTIONS='# +-Wl,-undefined,dynamic_lookup'
          ninja -C mesa/build-macos src/panfrost/vulkan/libvulkan_panfrost.dylib
          dylib=mesa/build-macos/src/panfrost/vulkan/libvulkan_panfrost.dylib
          python3 tools/fix-weak-imports.py "$dylib"
          if nm -u "$dylib" | grep -E '^_dri|^_expat|^_XML_' ; then
            echo 'macOS PanVK still has a hard xmlconfig/dri dependency' >&2
            exit 1
          fi

      - name: Upload macOS PanVK
        uses: actions/upload-artifact@v4
        with:
          name: panvk-macos
          path: mesa/build-macos/src/panfrost/vulkan/libvulkan_panfrost.dylib
          if-no-files-found: error
          retention-days: 7

      - name: Build native PanVK for iOS
        if: false
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          cat > ios.ini <<INI
          [binaries]
          c = ['xcrun', '--sdk', 'iphoneos', 'clang']
          cpp = ['xcrun', '--sdk', 'iphoneos', 'clang++']
          ar = ['xcrun', '--sdk', 'iphoneos', 'ar']
          strip = ['xcrun', '--sdk', 'iphoneos', 'strip']
          pkg-config = '/opt/homebrew/bin/pkg-config'
          [host_machine]
          system = 'darwin'
          cpu_family = 'aarch64'
          cpu = 'arm64'
          endian = 'little'
          [properties]
          c_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0', '-isysroot', '$sdk']
          cpp_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0', '-isysroot', '$sdk', '-I${{ github.workspace }}/src/backend']
          c_link_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0', '-isysroot', '$sdk']
          cpp_link_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0', '-isysroot', '$sdk']
          INI
          meson setup mesa/build-ios mesa --cross-file ios.ini \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers= \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled \
            -Dplatforms= \
            -Dzstd=disabled \
            -Dshader-cache=disabled \
            -Dmicrosoft-clc=disabled \
            -Dpanfrost-native-only=true \
            -Dc_args=-I${{ github.workspace }}/src/backend \
            -Dcpp_args=-I${{ github.workspace }}/src/backend
          ninja -C mesa/build-ios src/panfrost/vulkan/libvulkan_panfrost.dylib

      - name: Package Mali GPU addon
        if: false
        run: |
          set -eu
          dylib=mesa/build-ios/src/panfrost/vulkan/libvulkan_panfrost.dylib
          test -f "$dylib"
          codesign --force --sign - --pagesize 4096 "$dylib"
          python3 tools/make-mali-gpu-addon.py --dylib "$dylib" --publish --output mali-gpu.addon
          shasum -a 256 "$dylib" mali-gpu.addon > artifacts.sha256

      - name: Upload target artifacts
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: mali-target
          path: |
            mesa/build-ios/src/panfrost/vulkan/libvulkan_panfrost.dylib
            mali-gpu.addon
            artifacts.sha256
          if-no-files-found: error
          retention-days: 7
